<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; form-action 'none'">
<title>NCTS Networking Labs</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#14212e;--muted:#4f5f70;--line:#cfd8e2;--navy:#0f2f57;--navy2:#1b4478;--teal:#0f8b8d;--teal2:#e3f4f4;--ok:#1b6e34;--okbg:#e5f4e9;--bad:#a3261d;--badbg:#fbe9e7;--warn:#7a5200;--warnbg:#fff4d6;
--fs:17px;--mono:Consolas,"Cascadia Mono","DejaVu Sans Mono","Liberation Mono",monospace;--sans:"Segoe UI",Tahoma,Arial,"Noto Sans Arabic","Noto Sans",sans-serif}
body.big{--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px}
a{color:var(--navy2)}
code,.mono{font-family:var(--mono);font-size:.92em;background:#eaf0f5;padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
pre{font-family:var(--mono);background:#0e1b2a;color:#e6f0f7;padding:12px 14px;border-radius:8px;overflow:auto;direction:ltr;text-align:left;font-size:.88em;line-height:1.45;white-space:pre}
.t-ar{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
.t-sep{color:var(--muted)}
.both{border-inline-start:3px solid var(--teal);padding-inline-start:10px;margin:8px 0}
.both p{margin:3px 0}
.both p.t-ar{color:#1f3a4d;background:#f2f9f9;border-radius:6px;padding:4px 10px;text-align:right}
p.t-ar{text-align:right}
html[dir=rtl] p.t-ar{text-align:right}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:8px 14px}
.top .brand{font-weight:700;font-size:1.02em;display:flex;align-items:center;gap:8px}
.top .brand svg{flex:none}
.top .grow{flex:1}
.seg{display:inline-flex;border:1px solid #ffffff66;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:5px 10px;cursor:pointer;font-size:.86em}
.seg button[aria-pressed=true]{background:#fff;color:var(--navy);font-weight:700}
.top .tb{background:#ffffff1a;border:1px solid #ffffff66;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.86em}
.top .tb:hover{background:#ffffff33}
.chip-ed{font-size:.72em;font-weight:700;background:#ffd166;color:#3d2c00;border-radius:10px;padding:2px 8px;margin-inline-start:6px;vertical-align:2px}
.top .who{font-size:.86em;opacity:.95}
.layout{display:flex;min-height:calc(100vh - 54px)}
nav.side{width:290px;flex:none;background:#fff;border-inline-end:1px solid var(--line);padding:12px 10px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
nav.side a{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.9em}
nav.side a:hover{background:var(--teal2)}
nav.side a.on{background:var(--navy);color:#fff}
nav.side .grp{font-size:.74em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px}
nav.side .pct{font-size:.78em;font-weight:700;background:#eef2f6;color:var(--navy);border-radius:10px;padding:1px 7px;white-space:nowrap}
nav.side a.on .pct{background:#ffffff33;color:#fff}
main{flex:1;min-width:0;padding:20px 26px 60px;max-width:1180px}
.note-store{background:var(--warnbg);color:var(--warn);border:1px solid #e6c46b;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.9em}
h1{font-size:1.65em;color:var(--navy);margin:.2em 0 .4em;line-height:1.25}
h2{font-size:1.32em;color:var(--navy);margin:1.3em 0 .5em;line-height:1.3}
h3{font-size:1.14em;margin:.2em 0 .3em;color:var(--navy);line-height:1.35}
h4{font-size:.98em;margin:.9em 0 .3em;color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 2px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod-tile{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
.mod-tile:hover{border-color:var(--teal);box-shadow:0 2px 8px #0f8b8d22}
.mod-tile .num{font-weight:800;color:var(--teal);font-size:.85em}
.bar{height:9px;background:#e4ebf1;border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--teal)}
.pill{display:inline-block;font-size:.78em;font-weight:700;border-radius:20px;padding:2px 10px;background:#eef2f6;color:var(--navy);margin-inline-end:6px}
.k-lab{background:#e3eefc;color:#1b4478}.k-guided{background:var(--teal2);color:#0b6466}.k-challenge{background:#fbe7d5;color:#8a3d00}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.88em;margin:4px 0 6px}
.done-badge{color:var(--ok);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{border:1px solid #9fb0c2;background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.92em}
.btn:hover{background:#f0f5fa}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:4px 10px;font-size:.84em}
.btn[disabled]{opacity:.5;cursor:not-allowed}
ol.tasks{padding-inline-start:26px}
ol.tasks>li{margin:12px 0;padding:10px 12px;border:1px solid #e3e9ef;border-radius:10px;background:#fbfcfd}
.q-text{margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:5px;margin:6px 0}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid #e1e7ee;border-radius:8px;background:#fff;cursor:pointer}
.opts label:hover{border-color:var(--teal)}
.opts input{margin-top:5px}
.opt-why{font-size:.86em;color:var(--muted);margin-inline-start:26px}
input.inp,select.inp,textarea.inp{border:1px solid #9fb0c2;border-radius:7px;padding:6px 9px;background:#fff;min-width:0}
input.inp.ltr,.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
textarea.inp{width:100%;min-height:70px}
.fields{display:grid;grid-template-columns:minmax(150px,max-content) minmax(160px,1fr);gap:6px 12px;align-items:center;margin:6px 0}
.fields .f-ok::after{content:" ✔";color:var(--ok);font-weight:700}
.fields .f-bad::after{content:" ✘";color:var(--bad);font-weight:700}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.92em}
.fb.ok{background:var(--okbg);color:var(--ok);border:1px solid #9fd0ad}
.fb.bad{background:var(--badbg);color:var(--bad);border:1px solid #e7b1aa}
.fb.info{background:#eef4fa;color:#1f3a56;border:1px solid #c7d7e8}
.fb .x{color:var(--ink);margin-top:4px}
.match-row{display:grid;grid-template-columns:1fr minmax(170px,1fr);gap:8px;align-items:center;margin:5px 0;padding:6px 8px;border:1px solid #e3e9ef;border-radius:8px;background:#fff}
.order-list{list-style:none;padding:0;margin:6px 0}
.order-list li{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:4px 0;border:1px solid #cfd8e2;border-radius:8px;background:#fff;cursor:grab}
.order-list li.drag{opacity:.4}
.order-list li .pos{font-weight:800;color:var(--teal);min-width:1.4em}
.order-list li .lbl{flex:1}
.hints{margin-top:8px}
.hint{background:var(--warnbg);border:1px solid #ebd38e;border-radius:8px;padding:7px 12px;margin:6px 0;font-size:.92em}
.sol{background:#eef7ee;border:1px solid #b9dcc0;border-radius:10px;padding:10px 14px;margin-top:10px}
.sol ol{margin:4px 0;padding-inline-start:22px}
.refl{border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.rubric label{display:flex;gap:8px;align-items:flex-start;font-size:.92em;margin:3px 0}
.instr{background:#fff8e8;border:1px solid #ecd59a;border-radius:10px;padding:10px 14px;margin:12px 0}
.instr h4{color:#7a5200;margin-top:0}
.disclaimer{background:#eef4fa;border:1px solid #c7d7e8;border-radius:10px;padding:10px 14px;margin:12px 0;font-size:.92em}
.supp{display:inline-block;font-size:.75em;font-weight:700;background:#ede4fb;color:#5a2f9c;border-radius:6px;padding:1px 7px;margin-inline-start:4px;vertical-align:1px}
table.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92em;background:#fff}
table.tbl th,table.tbl td{border:1px solid #d7dfe7;padding:5px 8px;text-align:start;vertical-align:top}
table.tbl th{background:#eef3f8;color:var(--navy)}
table.tbl td.c{text-align:center}
.diag{margin:10px 0;text-align:center;overflow:auto}
.diag svg{max-width:100%;height:auto}
.term{background:#0e1b2a;color:#d7f7d7;font-family:var(--mono);border-radius:8px;padding:10px 12px;white-space:pre-wrap;direction:ltr;text-align:left;font-size:.86em;min-height:60px;margin:8px 0}
.stepper{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfe;margin:8px 0}
.stepper .stage{min-height:120px}
.stepper .cap{font-size:.92em;margin-top:6px}
.stepper .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.stepper .cnt{font-size:.85em;color:var(--muted);margin-inline-start:6px}
.ptable{font-family:var(--mono);font-size:.82em;direction:ltr;text-align:left}
.ptable table{border-collapse:collapse;width:100%}
.ptable th{background:#e9eef4;text-align:left;padding:3px 6px;position:sticky;top:0}
.ptable td{padding:2px 6px;white-space:nowrap;border-bottom:1px solid #fff}
.ptable .wrap{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pfbar{display:flex;gap:6px;margin:6px 0;direction:ltr}
.pfbar input{flex:1;font-family:var(--mono)}
.pfbar input.valid{background:#c9f7c9}.pfbar input.invalid{background:#ffc9c9}
.pmsg{font-size:.85em;color:var(--muted);direction:ltr;text-align:left}
.pdet{background:#f6f8fb;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin-top:6px;white-space:pre-wrap;font-size:.95em}
.frames{display:flex;gap:4px;flex-wrap:wrap;direction:ltr;margin:4px 0}
.fr{width:42px;height:34px;border-radius:6px;border:2px solid #9fb0c2;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:.9em;background:#fff;position:relative}
.fr.win{box-shadow:0 0 0 3px #f0a500}
.fr.sent{background:#dbe9fb;border-color:#6d95c9}
.fr.acked{background:#d5f0dc;border-color:#3f9a59}
.fr.lost{background:#fbe0dc;border-color:#c0473a}
.fr.buf{background:#fff1c7;border-color:#c99a1a}
.fr.dlv{background:#d5f0dc;border-color:#3f9a59}
.fr.exp{box-shadow:0 0 0 3px var(--teal)}
.lbl-row{font-size:.82em;color:var(--muted);margin-top:6px}
.log{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px;font-size:.88em;margin-top:8px}
.log div{padding:2px 0;border-bottom:1px dashed #edf1f5}
.log div.cur{background:#fff4d6}
.topo-tbl input.inp{width:100%;max-width:170px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.small{font-size:.86em;color:var(--muted)}
.bits{display:flex;gap:3px;direction:ltr;flex-wrap:wrap}
.bits button{width:34px;height:34px;border-radius:6px;border:1px solid #9fb0c2;background:#fff;font-family:var(--mono);font-weight:700;cursor:pointer}
.bits button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bits .w{font-size:.7em;color:var(--muted);text-align:center;width:34px}
.qcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 16px;margin:12px 0}
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:.84em}
.d-E{background:#e5f4e9;color:#1b6e34}.d-M{background:#fff1c7;color:#7a5200}.d-C{background:#fbe0dc;color:#8a2a20}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.score{font-size:1.2em;font-weight:800;color:var(--navy)}
.timer{font-family:var(--mono);font-weight:700;font-size:1.1em;background:#0e1b2a;color:#fff;border-radius:8px;padding:4px 10px}
.gloss td:first-child{font-weight:700;white-space:nowrap}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.toc a{font-size:.85em;text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:3px 10px;background:#fff}
.vrow input.inp{width:100%}
#printArea{display:none}
.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;padding:18px 20px;max-width:520px;width:92vw}
@media (max-width:900px){nav.side{display:none}nav.side.open{display:block;position:fixed;z-index:30;top:54px;inset-inline-start:0;height:calc(100vh - 54px);box-shadow:0 0 20px #0005}main{padding:14px}.menu-btn{display:inline-block!important}}
.menu-btn{display:none}
@media print{
 body{background:#fff;font-size:12pt}
 .top,nav.side,main,.layout,.no-print{display:none!important}
 #printArea{display:block!important;padding:0}
 .pa-mod+.pa-mod{page-break-before:always}
 .pa-item{page-break-inside:avoid;border:1px solid #bbb;border-radius:6px;padding:6px 10px;margin:6px 0}
 .pa-ans{border:1px dashed #999;min-height:2.2em;margin-top:4px}
 pre{background:#f4f4f4;color:#000;border:1px solid #ccc}
 code{background:none;border:1px solid #ccc}
 a{color:#000;text-decoration:none}
}
</style>
</head>

  <button class="tb menu-btn" id="menuBtn" aria-label="Menu">☰</button>

</header>
<div class="layout">
  <nav class="side no-print" id="side" aria-label="Modules"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="printArea"></div>
